{% extends 'base.html' %}

{% block title %}{{ heading }} | CampusFind{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 class="h4 mb-3">{{ heading }}</h2>
        {% if note %}
          <div class="alert alert-info small">{{ note }}</div>
        {% endif %}
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% include 'includes/form_fields.html' %}
          <button type="submit" class="btn btn-primary w-100">Save report</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
