{% extends 'base.html' %}

{% block title %}Delete report | {{ SITE_TITLE }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body p-4">
        <h2 class="h5">Delete this report?</h2>
        <p>You are about to delete <strong>{{ item.title }}</strong>. This cannot be undone.</p>
        <form method="post" class="d-flex gap-2">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a href="{% url 'item_detail' item.pk %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
