<div class="card h-100 shadow-sm">
  {% if item.image %}
    <img src="{{ item.image.url }}" class="card-img-top"
         alt="Photo of {{ item.title }}" style="height: 160px; object-fit: cover;">
  {% else %}
    <div class="bg-light text-muted d-flex align-items-center justify-content-center"
         style="height: 160px;">No photo</div>
  {% endif %}
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-start mb-1">
      <h3 class="h6 mb-0">{{ item.title }}</h3>
      <span class="badge {{ item.status_badge_class }}">{{ item.get_status_display }}</span>
    </div>
    <p class="small text-muted mb-2">
      {{ item.get_item_type_display }} &middot; {{ item.get_category_display }}<br>
      {{ item.get_location_display }} &middot; {{ item.date|date:"d M Y" }}
    </p>
    <a href="{% url 'item_detail' item.pk %}" class="stretched-link small">View details</a>
  </div>
</div>
